<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVORA | ليفورا - متجر الأناقة والجمال الفاخر</title>
  <meta http-equiv="refresh" content="2; url=http://localhost:3000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Tajawal:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F6F0E8;
      --dark: #171717;
      --gold: #C8A96B;
      --cream: #FAF7F2;
      --border: #E8DFD3;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Tajawal', sans-serif;
      background-color: var(--bg);
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 40px 30px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(23, 23, 23, 0.06);
    }
    .logo {
      font-family: 'Cinzel', serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--dark);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .sublogo {
      font-size: 11px;
      letter-spacing: 0.3em;
      color: var(--gold);
      font-weight: 600;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--dark);
    }
    p {
      font-size: 13px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 25px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      border-radius: 16px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background: var(--dark);
      color: var(--gold);
      border: 1px solid rgba(200, 169, 107, 0.4);
    }
    .btn-primary:hover {
      background: var(--gold);
      color: var(--dark);
    }
    .btn-secondary {
      background: var(--cream);
      color: var(--dark);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: #eee6db;
    }
    .loader {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid #E8DFD3;
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 15px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">LIVORA</div>
    <div class="sublogo">ليفورا</div>

    <div class="loader"></div>
    <h1>جاري التوجيه إلى متجر ليفورا...</h1>
    <p>سيتم نقلكِ تلقائياً إلى المتجر خلال لحظات، أو يمكنكِ اختيار أحد الروابط المباشرة أدناه:</p>

    <div class="links">
      <a href="http://localhost:3000" class="btn btn-primary">🛍️ واجهة المتجر الرئيسية</a>
      <a href="http://localhost:3000/admin" class="btn btn-secondary">⚙️ لوحة تحكم الإدارة (Dashboard)</a>
      <a href="http://localhost:3000/admin/login" class="btn btn-secondary">🔐 تسجيل الدخول للوحة التحكم</a>
    </div>
  </div>
</body>
</html>
